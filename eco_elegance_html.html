<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco_Elegance — Gifting, Naturally</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7f4; color: #1a1a1a; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }

  /* Header */
  .pc-header { background: #fff; border-bottom: 1px solid #e0e8d8; padding: 14px 24px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .pc-logo { font-size: 18px; font-weight: 600; white-space: nowrap; color: #1a1a1a; display: flex; align-items: center; gap: 8px; }
  .pc-logo i { font-size: 22px; color: #3B6D11; }
  .pc-logo em { font-style: normal; color: #3B6D11; }
  .pc-tagline { font-size: 12px; color: #888; white-space: nowrap; }
  .pc-searchbox { flex: 1; display: flex; align-items: center; gap: 8px; background: #f5f7f4; border: 1px solid #d4e3c4; border-radius: 8px; padding: 0 12px; }
  .pc-searchbox input { border: none; background: transparent; font-size: 14px; padding: 9px 0; outline: none; flex: 1; color: #1a1a1a; }
  .pc-searchbox input::placeholder { color: #aaa; }
  .pc-searchbox i { font-size: 16px; color: #aaa; }
  .pc-count { font-size: 13px; color: #888; white-space: nowrap; }

  /* Banner */
  .pc-banner { background: #EAF3DE; border-bottom: 1px solid #C0DD97; padding: 10px 24px; display: flex; align-items: center; gap: 10px; }
  .pc-banner i { font-size: 16px; color: #3B6D11; flex-shrink: 0; }
  .pc-banner span { font-size: 13px; color: #27500A; }

  /* Grid */
  .pc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; padding: 24px; max-width: 1200px; margin: 0 auto; }
  .pc-card { background: #fff; border: 1px solid #e0e8d8; border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
  .pc-card:hover { border-color: #97C459; box-shadow: 0 4px 16px rgba(59,109,17,0.08); }
  .pc-thumb { height: 130px; display: flex; align-items: center; justify-content: center; background: #EAF3DE; }
  .pc-thumb i { font-size: 44px; color: #3B6D11; }
  .pc-cbody { padding: 12px 14px 16px; }
  .pc-ctag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #EAF3DE; color: #27500A; margin-bottom: 7px; }
  .pc-cname { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 3px; }
  .pc-cmeta { font-size: 12px; color: #888; margin-bottom: 8px; font-style: italic; }
  .pc-cprice { font-size: 15px; color: #3B6D11; font-weight: 600; }

  /* Modal overlay */
  .pc-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .pc-overlay.hidden { display: none; }
  .pc-modal { background: #fff; border-radius: 14px; border: 1px solid #e0e8d8; width: 500px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
  .pc-mhead { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #e0e8d8; position: sticky; top: 0; background: #fff; z-index: 1; }
  .pc-mhead-type { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .pc-mclose { background: transparent; border: none; cursor: pointer; color: #888; padding: 4px 6px; font-size: 20px; line-height: 1; border-radius: 6px; }
  .pc-mclose:hover { background: #f5f7f4; color: #1a1a1a; }
  .pc-mthumb { height: 170px; display: flex; align-items: center; justify-content: center; background: #EAF3DE; }
  .pc-mthumb i { font-size: 68px; color: #3B6D11; }
  .pc-mbody { padding: 18px 22px 0; }
  .pc-mbadge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 6px; background: #EAF3DE; color: #27500A; margin-bottom: 10px; }
  .pc-mname { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 3px; }
  .pc-msub { font-size: 13px; color: #888; font-style: italic; margin-bottom: 8px; }
  .pc-mprice { font-size: 22px; font-weight: 700; color: #3B6D11; margin-bottom: 12px; }
  .pc-mdesc { font-size: 14px; color: #555; line-height: 1.65; margin-bottom: 14px; }
  .pc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .pc-chip { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid #C0DD97; color: #3B6D11; background: transparent; }
  .pc-specs { border-top: 1px solid #e0e8d8; padding-top: 14px; }
  .pc-sr { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f0f4ec; }
  .pc-sr:last-child { border-bottom: none; }
  .pc-sr span:first-child { color: #888; }
  .pc-sr span:last-child { color: #1a1a1a; font-weight: 500; }
  .pc-mfoot { padding: 18px 22px; }
  .pc-enq { display: block; width: 100%; padding: 12px; background: #3B6D11; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; }
  .pc-enq:hover { background: #27500A; }

  .pc-empty { grid-column: 1/-1; text-align: center; padding: 4rem 0; color: #aaa; font-size: 14px; }
  .pc-empty i { font-size: 32px; display: block; margin-bottom: 10px; }

  /* Footer */
  .pc-footer { text-align: center; padding: 2rem; font-size: 13px; color: #aaa; border-top: 1px solid #e0e8d8; margin-top: 2rem; }
  .pc-footer em { color: #3B6D11; font-style: normal; font-weight: 500; }
</style>
</head>
<body>

<div id="pcApp">
  <header class="pc-header">
    <div class="pc-logo"><i class="ti ti-leaf"></i>Eco<em>_Elegance</em></div>
    <div class="pc-tagline">Gifting, naturally.</div>
    <div class="pc-searchbox">
      <i class="ti ti-search"></i>
      <input type="text" id="pcSearch" placeholder="Search plants & hampers…" oninput="pcFilter()">
    </div>
    <div class="pc-count" id="pcCount">12 products</div>
  </header>

  <div class="pc-banner">
    <i class="ti ti-package"></i>
    <span>All hampers include eco-friendly packaging &nbsp;·&nbsp; Free personalised gift card with every order</span>
  </div>

  <div class="pc-grid" id="pcGrid"></div>

  <div class="pc-overlay hidden" id="pcOverlay" onclick="pcCloseOverlay(event)">
    <div class="pc-modal" onclick="event.stopPropagation()">
      <div class="pc-mhead">
        <span class="pc-mhead-type" id="pmType"></span>
        <button class="pc-mclose" onclick="pcClose()" aria-label="Close">&times;</button>
      </div>
      <div class="pc-mthumb" id="pmThumb"></div>
      <div class="pc-mbody">
        <div class="pc-mbadge" id="pmBadge"></div>
        <div class="pc-mname" id="pmName"></div>
        <div class="pc-msub" id="pmSub"></div>
        <div class="pc-mprice" id="pmPrice"></div>
        <div class="pc-mdesc" id="pmDesc"></div>
        <div class="pc-chips" id="pmChips"></div>
        <div class="pc-specs" id="pmSpecs"></div>
      </div>
      <div class="pc-mfoot">
        <button class="pc-enq" onclick="enquire()">Gift this now &rarr;</button>
      </div>
    </div>
  </div>

  <footer class="pc-footer">
    &copy; 2026 <em>Eco_Elegance</em> &nbsp;·&nbsp; Gifting, naturally. &nbsp;·&nbsp; All rights reserved.
  </footer>
</div>

<script>
const iconMap = {
  "Succulent":"ti-plant","Air Purifier":"ti-seeding","Trailing Plant":"ti-leaf",
  "Flowering Plant":"ti-plant-2","Medicinal Plant":"ti-leaf-2","Low Light Special":"ti-trees",
  "Statement Plant":"ti-plant","Feng Shui":"ti-seeding","Gift Hamper":"ti-gift","Aromatic Plant":"ti-leaf"
};

let pcData = [];
window.pcActive = null;

fetch('products.json')
  .then(r => r.json())
  .then(json => {
    pcData = json.products.map(p => ({
      id: p.id,
      name: p.name,
      sub: p.botanical_name,
      type: p.type,
      price: p.price,
      icon: iconMap[p.type] || "ti-leaf",
      desc: p.description,
      tags: p.tags,
      specs: Object.fromEntries(
        Object.entries(p.care).map(([k,v]) => [k.charAt(0).toUpperCase()+k.slice(1).replace(/_/g,' '), v])
      )
    }));
    pcRender(pcData);
  })
  .catch(() => {
    document.getElementById("pcGrid").innerHTML =
      '<div class="pc-empty"><i class="ti ti-alert-circle"></i>Could not load products.json. Make sure it is in the same folder as index.html.</div>';
  });

function pcFilter() {
  const q = document.getElementById("pcSearch").value.toLowerCase();
  const list = q ? pcData.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.type.toLowerCase().includes(q) ||
    p.desc.toLowerCase().includes(q) ||
    p.tags.some(t => t.toLowerCase().includes(q))
  ) : pcData;
  pcRender(list);
}

function pcRender(list) {
  const g = document.getElementById("pcGrid");
  const n = list.length;
  document.getElementById("pcCount").textContent = n + " product" + (n !== 1 ? "s" : "");
  if (!n) {
    g.innerHTML = '<div class="pc-empty"><i class="ti ti-search-off"></i>No plants match your search.</div>';
    return;
  }
  g.innerHTML = list.map(p => `
    <div class="pc-card" onclick="pcOpen(${p.id})" role="button" tabindex="0" aria-label="View ${p.name}">
      <div class="pc-thumb"><i class="ti ${p.icon}"></i></div>
      <div class="pc-cbody">
        <span class="pc-ctag">${p.type}</span>
        <div class="pc-cname">${p.name}</div>
        <div class="pc-cmeta">${p.sub}</div>
        <div class="pc-cprice">&#8377;${p.price.toLocaleString("en-IN")}</div>
      </div>
    </div>`).join("");
}

function pcOpen(id) {
  const p = pcData.find(x => x.id === id);
  window.pcActive = p;
  document.getElementById("pmType").textContent = p.type;
  document.getElementById("pmThumb").innerHTML = `<i class="ti ${p.icon}"></i>`;
  document.getElementById("pmBadge").textContent = p.type;
  document.getElementById("pmName").textContent = p.name;
  document.getElementById("pmSub").textContent = p.sub;
  document.getElementById("pmPrice").textContent = "₹" + p.price.toLocaleString("en-IN");
  document.getElementById("pmDesc").textContent = p.desc;
  document.getElementById("pmChips").innerHTML = p.tags.map(t => `<span class="pc-chip">${t}</span>`).join("");
  document.getElementById("pmSpecs").innerHTML = Object.entries(p.specs).map(([k, v]) =>
    `<div class="pc-sr"><span>${k}</span><span>${v}</span></div>`).join("");
  document.getElementById("pcOverlay").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}

function pcClose() {
  document.getElementById("pcOverlay").classList.add("hidden");
  document.body.style.overflow = "";
}

function pcCloseOverlay(e) {
  if (e.target === document.getElementById("pcOverlay")) pcClose();
}

function enquire() {
  const p = window.pcActive;
  window.location.href = `mailto:hello@ecoelegance.in?subject=Enquiry: ${encodeURIComponent(p.name)}&body=Hi, I am interested in ordering: ${encodeURIComponent(p.name)} (₹${p.price}). Please share more details.`;
}

document.addEventListener("keydown", e => { if (e.key === "Escape") pcClose(); });

pcRender(pcData);
</script>
</body>
</html>
